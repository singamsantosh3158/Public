<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%232563eb'/%3E%3Cpath d='M13 27 L38 14 L29 39 L25 28 L13 27 Z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --surface: rgba(255, 255, 255, 0.88);
    --border: rgba(15, 23, 42, 0.08);
    --text: #1e1b3a;
    --text-muted: #6b6690;
    --input-bg: #ffffff;
    --shadow: 0 8px 30px rgba(76, 29, 149, 0.25), 0 2px 8px rgba(76, 29, 149, 0.15);

    --user-grad: linear-gradient(135deg, #4facfe 0%, #00c6fb 100%);
    --user-text: #ffffff;
    --assistant-grad: linear-gradient(135deg, #6a5cf6 0%, #a06cf7 100%);
    --assistant-text: #ffffff;
    --itinerary-grad: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    --itinerary-text: #4a1942;
    --logistics-grad: linear-gradient(135deg, #11d3ac 0%, #38f9d7 100%);
    --logistics-text: #063a34;
    --error-grad: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
    --error-text: #4a1400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgba(24, 20, 43, 0.88);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1edff;
      --text-muted: #b3aad6;
      --input-bg: #251f45;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 1.5rem;
    background: linear-gradient(120deg, #6a5cf6, #a06cf7, #fa709a, #fee140, #11d3ac, #4facfe);
    background-size: 300% 300%;
    animation: gradientShift 20s ease infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #app {
    width: 100%;
    max-width: 720px;
    height: calc(100vh - 3rem);
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    background: linear-gradient(120deg, #6a5cf6, #c161ea, #fa709a);
    color: #fff;
  }
  header .logo { flex: none; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  header .titles { display: flex; flex-direction: column; min-width: 0; }
  header h1 { font-size: 1.1rem; margin: 0; line-height: 1.3; font-weight: 800; }
  header .tagline { font-size: 0.78rem; color: rgba(255,255,255,0.85); }
  #session-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
  }
  #session-row label { font-size: 0.75rem; color: rgba(255,255,255,0.85); white-space: nowrap; }
  #session-name {
    width: 9.5rem;
    padding: 0.4rem 0.6rem;
    font-size: 0.82rem;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    background: rgba(255,255,255,0.18);
    color: #fff;
  }
  #session-name::placeholder { color: rgba(255,255,255,0.7); }
  #session-name:focus, #input:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
  }
  #new-chat {
    flex: none;
    padding: 0.4rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  #new-chat:hover { background: rgba(255,255,255,0.3); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 26rem;
    line-height: 1.6;
  }
  #empty-state .emoji { font-size: 2.2rem; display: block; margin-bottom: 0.5rem; }
  .msg { max-width: 84%; display: flex; align-items: flex-end; gap: 0.5rem; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }
  .avatar {
    flex: none;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .msg-body { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
  .msg.user .msg-body { align-items: flex-end; }
  .msg .label { font-size: 0.7rem; color: var(--text-muted); padding: 0 0.3rem; font-weight: 600; }
  .msg .bubble {
    padding: 0.65rem 0.9rem;
    border-radius: 16px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.92rem;
    box-shadow: 0 3px 10px rgba(31, 15, 84, 0.12);
  }
  .msg.user .bubble { background: var(--user-grad); color: var(--user-text); border-bottom-right-radius: 4px; }
  .avatar.user { background: var(--user-grad); }
  .msg.agent .bubble { background: var(--assistant-grad); color: var(--assistant-text); border-bottom-left-radius: 4px; }
  .avatar.travel-assistant { background: var(--assistant-grad); }
  .msg.agent.role-itinerary-planner .bubble { background: var(--itinerary-grad); color: var(--itinerary-text); }
  .avatar.itinerary-planner { background: var(--itinerary-grad); }
  .msg.agent.role-trip-logistics .bubble { background: var(--logistics-grad); color: var(--logistics-text); }
  .avatar.trip-logistics { background: var(--logistics-grad); }
  .msg.agent.role-error .bubble { background: var(--error-grad); color: var(--error-text); }
  .avatar.error { background: var(--error-grad); }
  .msg.agent.thinking .bubble { font-style: italic; opacity: 0.85; }
  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.1rem;
    padding: 0.4rem 0.85rem;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #11d3ac, #4facfe);
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(17, 211, 172, 0.4);
    transition: transform 0.12s ease;
  }
  .download-link:hover { transform: translateY(-1px) scale(1.03); }
  .bubble img.msg-photo {
    display: block;
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 12px;
    margin: 0.1rem 0 0.5rem;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  #input-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 0.7rem 1.1rem;
    font-size: 0.92rem;
    border: 2px solid transparent;
    border-radius: 999px;
    background: var(--input-bg);
    color: var(--text);
  }
  #input:focus { border-color: #a06cf7; }
  #send {
    flex: none;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #6a5cf6, #fa709a);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(122, 92, 246, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #send:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 6px 18px rgba(250, 112, 154, 0.55); }
  #send:active:not(:disabled) { transform: scale(0.94); }
  #send:disabled { opacity: 0.5; cursor: default; }
  #send svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <svg class="logo" width="34" height="34" viewBox="0 0 48 48" role="img" aria-label="Travel Assistant logo">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fee140"/>
            <stop offset="1" stop-color="#fa709a"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="url(#logoGrad)"/>
        <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" fill="none">
          <ellipse cx="24" cy="24" rx="22" ry="9"/>
          <ellipse cx="24" cy="24" rx="9" ry="22"/>
          <line x1="2" y1="24" x2="46" y2="24"/>
        </g>
        <path d="M13 27 L38 14 L29 39 L25 28 L13 27 Z" fill="#ffffff"/>
        <path d="M13 27 L25 28 L21 32 Z" fill="#4a1942"/>
      </svg>
      <div class="titles">
        <h1>Travel Assistant</h1>
        <span class="tagline">Itinerary planning &amp; trip logistics</span>
      </div>
      <div id="session-row">
        <label for="session-name">Trip</label>
        <input id="session-name" placeholder="session name">
        <button id="new-chat" type="button" title="Start a new chat">＋ New</button>
      </div>
    </header>

    <div id="messages">
      <div id="empty-state">
        <span class="emoji">🌍✈️🧭</span>
        Describe a trip you're planning, or ask a logistics question — packing, visas, weather, currency. Reuse the same trip name later to pick this conversation back up.
      </div>
    </div>

    <div id="input-row">
      <input id="input" placeholder="Message the Travel Assistant…" autocomplete="off">
      <button id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const sessionEl = document.getElementById("session-name");
const newChatBtn = document.getElementById("new-chat");
let emptyStateEl = document.getElementById("empty-state");

const EMPTY_STATE_HTML = `
  <span class="emoji">🌍✈️🧭</span>
  Describe a trip you're planning, or ask a logistics question — packing, visas, weather, currency. Reuse the same trip name later to pick this conversation back up.
`;

function newSessionId() {
  return "trip-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
}

// The active session id, kept separate from the visible field so the field
// can stay empty (showing its placeholder) until the user actually names a
// trip. An unnamed chat still gets a real, unique id behind the scenes.
let currentSessionId = newSessionId();

function currentSessionName() {
  return sessionEl.value.trim() || currentSessionId;
}

function clearMessagesView() {
  messagesEl.innerHTML = "";
  emptyStateEl = document.createElement("div");
  emptyStateEl.id = "empty-state";
  emptyStateEl.innerHTML = EMPTY_STATE_HTML;
  messagesEl.appendChild(emptyStateEl);
  inputEl.focus();
}

function resetChat() {
  currentSessionId = newSessionId();
  sessionEl.value = "";
  clearMessagesView();
}

const AVATARS = {
  "you": "🧳",
  "travel-assistant": "🧭",
  "itinerary-planner": "🗺️",
  "trip-logistics": "🎒",
  "error": "⚠️",
};

function slugify(label) {
  return label.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

// Minimal, escaped Markdown rendering: only images and bold survive as HTML,
// everything else stays as plain (escaped) text. Keeps agent output safe to
// inject even though it's LLM-generated, not user-typed HTML.
function renderMarkdownLite(text) {
  const escaper = document.createElement("div");
  escaper.textContent = text;
  let html = escaper.innerHTML;
  html = html.replace(
    /!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, alt, url) => `<img class="msg-photo" src="${url}" alt="${alt}" loading="lazy">`
  );
  html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  html = html.replace(/\n/g, "<br>");
  return html;
}

function addMessage(label, text, side, downloadUrl) {
  if (emptyStateEl) emptyStateEl.remove();
  const slug = slugify(label);
  const wrap = document.createElement("div");
  wrap.className = `msg ${side} role-${slug}`;

  const avatar = document.createElement("div");
  avatar.className = `avatar ${side === "user" ? "user" : slug}`;
  avatar.textContent = AVATARS[slug] || (side === "user" ? "🧳" : "💬");

  const body = document.createElement("div");
  body.className = "msg-body";

  const labelEl = document.createElement("span");
  labelEl.className = "label";
  labelEl.textContent = label;

  const bubble = document.createElement("span");
  bubble.className = "bubble";
  bubble.innerHTML = renderMarkdownLite(text);

  body.appendChild(labelEl);
  body.appendChild(bubble);

  if (downloadUrl) {
    const link = document.createElement("a");
    link.className = "download-link";
    link.href = downloadUrl;
    link.textContent = "⬇ Download itinerary (PDF)";
    link.setAttribute("download", "");
    body.appendChild(link);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(body);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

async function send() {
  const message = inputEl.value.trim();
  if (!message) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMessage("You", message, "user");
  const thinking = addMessage("Travel Assistant", "Thinking…", "agent");
  thinking.classList.add("thinking");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_name: currentSessionName(),
        message: message,
      }),
    });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) {
      addMessage("Error", data.error || "Something went wrong.", "agent");
    } else {
      addMessage(data.agent, data.reply, "agent", data.download_url);
    }
  } catch (err) {
    thinking.remove();
    addMessage("Error", String(err), "agent");
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
newChatBtn.addEventListener("click", resetChat);

// Renaming the trip mid-page means switching to a different saved
// conversation — clear the view so it doesn't show messages that don't
// belong to that session (its real history still lives server-side).
let lastSessionValue = "";
sessionEl.addEventListener("change", () => {
  const value = sessionEl.value.trim();
  if (value !== lastSessionValue) {
    clearMessagesView();
  }
  lastSessionValue = value;
});
</script>
</body>
</html>
